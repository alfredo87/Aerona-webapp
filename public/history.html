<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101827">
    <title>Grant Aerona history</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <main>
      <header>
        <div><p class="eyebrow">GRANT AERONA</p><h1>History</h1></div>
        <div class="header-actions"><nav class="page-nav" aria-label="App pages"><a href="/">Dashboard</a><a class="active" href="/history.html" aria-current="page">History</a></nav><button id="logout" class="logout">Sign out</button></div>
      </header>

      <section class="history-toolbar" aria-label="Chart options">
        <div class="range-picker" aria-label="History range"><button class="active" data-hours="24">24 hours</button><button data-hours="168">7 days</button></div>
        <p id="history-status" class="muted">Loading history…</p>
      </section>

      <nav class="metric-picker" aria-label="Choose chart">
        <button class="active" data-group="climate">Climate</button><button data-group="hotwater">Hot water</button><button data-group="electrical">Electrical</button><button data-group="thermal">Thermal</button><button data-group="cop">COP</button><button data-group="spf">SPF</button><button data-group="flow">Flow</button><button data-group="fan">Fan</button><button data-group="pressure">Pressure</button>
      </nav>

      <section id="history-charts" class="history-charts" aria-live="polite"></section>
    </main>
    <script src="/history.js"></script>
  </body>
</html>
